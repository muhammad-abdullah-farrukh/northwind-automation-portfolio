<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="769" viewBox="0 0 1280 769" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #475569; }
      .lane { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .s { font-size: 12px; fill: #64748b; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge2 { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
      .lbl { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="769" fill="#f8fafc"/>

  <text x="40" y="54" class="title">Northwind Digital automation</text>
  <text x="40" y="80" class="subtitle">Zapier · n8n · Python. Two no-code flows hand the hard part to one tested engine with a local LLM.</text>

  <!-- lane labels -->
  <text x="40" y="114" class="lane">COMES IN</text>
  <text x="300" y="114" class="lane">ORCHESTRATION (NO-CODE)</text>
  <text x="640" y="114" class="lane">ENGINE (PYTHON)</text>
  <text x="990" y="114" class="lane">GOES OUT</text>

  <!-- inputs -->
  <rect x="40" y="140" width="210" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="170" class="h">Website lead</text>
  <text x="58" y="194" class="t">Google Form / Catch Hook</text>
  <text x="58" y="214" class="s">name, email, budget, need</text>

  <rect x="40" y="430" width="210" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="460" class="h">Supplier invoice</text>
  <text x="58" y="484" class="t">PDF by email (Gmail)</text>
  <text x="58" y="504" class="t">or upload form</text>
  <text x="58" y="526" class="s">one run per PDF</text>

  <!-- Zapier LeadRouter -->
  <rect x="300" y="140" width="290" height="190" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="320" y="172" class="h">LeadRouter · Zapier</text>
  <text x="320" y="198" class="t">Validate (Python Code step)</text>
  <text x="320" y="219" class="t">Enrich via OpsCore</text>
  <text x="320" y="240" class="t">AI fit score (lead_icp_v1 prompt)</text>
  <text x="320" y="261" class="t">0.6 × AI + 0.4 × rules → tier</text>
  <text x="320" y="282" class="t">Paths: hot · warm · cold · spam</text>
  <text x="320" y="310" class="s">audit row in Zapier Tables</text>

  <!-- n8n InvoiceIQ -->
  <rect x="300" y="400" width="290" height="250" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="320" y="432" class="h">InvoiceIQ · n8n</text>
  <text x="320" y="458" class="t">Submit job, wait for signed callback</text>
  <text x="320" y="479" class="t">Verify HMAC + 5-min freshness</text>
  <text x="320" y="500" class="t">Route: auto-approve · Slack review</text>
  <text x="320" y="521" class="t">         · duplicate · failed</text>
  <text x="320" y="542" class="t">Store, index, anomaly flags</text>
  <text x="320" y="568" class="t">Finance Q&amp;A agent (local LLM)</text>
  <text x="320" y="589" class="s">read-only SQL role · pgvector search</text>
  <text x="320" y="616" class="s">error workflow → #ops-alerts</text>

  <!-- OpsCore engine -->
  <rect x="640" y="140" width="300" height="510" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="660" y="174" class="h">OpsCore · FastAPI</text>
  <text x="660" y="196" class="s">API keys · idempotency · rate limits</text>

  <rect x="660" y="212" width="260" height="70" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="676" y="238" class="t" font-weight="700">POST /v1/leads/enrich</text>
  <text x="676" y="258" class="s">MX · free/disposable mail · safe fetch</text>
  <text x="676" y="274" class="s">site summary · rule score · 30-day cache</text>

  <rect x="660" y="294" width="260" height="104" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="676" y="320" class="t" font-weight="700">POST /v1/jobs  (async invoices)</text>
  <text x="676" y="340" class="s">Celery worker · retries with backoff</text>
  <text x="676" y="356" class="s">PDF text → LLM → validate → 1 repair</text>
  <text x="676" y="372" class="s">confidence · duplicate check</text>
  <text x="676" y="388" class="s">HMAC-signed callback, TLS pinned</text>

  <rect x="660" y="410" width="125" height="72" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="674" y="436" class="t" font-weight="700">Postgres 16</text>
  <text x="674" y="455" class="s">jobs · finance</text>
  <text x="674" y="471" class="s">pgvector</text>
  <rect x="795" y="410" width="125" height="72" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="809" y="436" class="t" font-weight="700">Redis</text>
  <text x="809" y="455" class="s">Celery queue</text>

  <rect x="660" y="494" width="260" height="74" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="676" y="520" class="t" font-weight="700">Ollama · local GPU</text>
  <text x="676" y="540" class="s">qwen3 4B (extract, enrich, agent)</text>
  <text x="676" y="556" class="s">nomic-embed-text (search)</text>

  <rect x="660" y="580" width="260" height="56" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="676" y="604" class="t" font-weight="700">Evals + CI gate</text>
  <text x="676" y="622" class="s">labelled invoices &amp; leads, replayed in CI</text>

  <!-- outputs -->
  <rect x="990" y="140" width="250" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1008" y="170" class="h">Sales</text>
  <text x="1008" y="196" class="t">Zoho CRM: contact, account, deal</text>
  <text x="1008" y="217" class="t">Slack #sales-hot ping</text>
  <text x="1008" y="238" class="t">Gmail reply draft (never sent)</text>
  <text x="1008" y="259" class="t">Zoho lead + "nurture" tag</text>
  <text x="1008" y="280" class="t">Google Sheet: cold leads</text>
  <text x="1008" y="310" class="s">hot · warm · cold · spam</text>

  <rect x="990" y="400" width="250" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1008" y="432" class="h">Finance</text>
  <text x="1008" y="458" class="t">Slack #finance-approvals</text>
  <text x="1008" y="476" class="s">review form: approve / correct / reject</text>
  <text x="1008" y="502" class="t">Google Sheet "Northwind Ledger"</text>
  <text x="1008" y="528" class="t">Postgres finance schema</text>
  <text x="1008" y="554" class="t">Chat answers citing invoice no.</text>
  <text x="1008" y="580" class="t">Slack #ops-alerts on failure</text>
  <text x="1008" y="616" class="s">human corrections → eval ground truth</text>

  <!-- edges -->
  <path d="M250,188 L298,188" class="edge"/>
  <path d="M250,486 L298,486" class="edge"/>
  <path d="M590,219 L658,240" class="edge2"/>
  <text x="615" y="264" class="lbl" text-anchor="middle">HTTPS</text>
  <text x="615" y="278" class="lbl" text-anchor="middle">tunnel</text>
  <path d="M590,470 C620,470 625,346 658,346" class="edge2"/>
  <text x="615" y="502" class="lbl" text-anchor="middle">job +</text>
  <text x="615" y="516" class="lbl" text-anchor="middle">signed</text>
  <text x="615" y="530" class="lbl" text-anchor="middle">callback</text>
  <path d="M560,140 L560,128 L965,128 L965,236 L988,236" class="edge"/>
  <path d="M560,650 L560,664 L965,664 L965,520 L988,520" class="edge"/>

  <text x="40" y="735" class="s">Synthetic data only (fictional vendors and leads). Secrets live in .env and the tools' own credential stores. Every metric in the READMEs comes from a recorded run.</text>
</svg>
